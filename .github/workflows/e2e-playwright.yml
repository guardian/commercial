name: E2E
permissions:
  contents: read
  id-token: write
on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:

concurrency:
  group: 'playwright-${{ github.head_ref }}'
  cancel-in-progress: true

jobs:
  test:
    name: Playwright
    timeout-minutes: 30
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5]
    steps:
      # Commercial
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: ./.github/actions/setup-node-env

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.GU_ARTIFACTS_ROLE_ARN }}
          aws-region: eu-west-1
          mask-aws-account-id: 'true'

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.1.6
        with:
          mask-password: 'true'

      - name: Start DCR in a container
        id: start-dcr-container
        continue-on-error: true
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/guardian/dotcom-rendering:branch-main"

          docker pull $IMAGE
          docker run -d \
            --network host \
            -p 3030:3032 \
            -e "PORT=3030" \
            -e "COMMERCIAL_BUNDLE_URL=http://localhost:3031/graun.standalone.commercial.js" \
            $IMAGE

      - name: Clear AWS credentials
        if: always()
        shell: bash
        run: |
          echo "AWS_ACCESS_KEY_ID=''" >>"$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=''" >>"$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=''" >>"$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=''" >>"$GITHUB_ENV"
          echo "AWS_REGION=''" >>"$GITHUB_ENV"

      - name: Report if "start DCR in a container" step failed
        if: ${{ steps.start-dcr-container.outcome == 'failure' }}
        run: echo "Unable to fetch a DCR container image from the registry. Run the DCR main build in order to create a new container image." && exit 1

      - name: Turn off mandb updates
        run: |
          sudo mv /usr/bin/mandb /usr/bin/mandb-OFF
          sudo cp -p /bin/true /usr/bin/mandb

      - name: Install Playwright Browsers
        run: pnpm playwright install --with-deps chromium
        working-directory: ./bundle

      - name: Start Commercial server
        run: pnpm serve & npx wait-on -v -i 1000 http://localhost:3031/graun.standalone.commercial.js
        working-directory: ./bundle

      - name: Run Playwright
        run: pnpm playwright test --shard=${{ matrix.group }}/5
        working-directory: ./bundle

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-${{ matrix.group }}
          path: ./bundle/playwright-report
          retention-days: 5
