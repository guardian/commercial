name: E2E
permissions:
  contents: read
  id-token: write
on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:

concurrency:
  group: 'playwright-${{ github.head_ref }}'
  cancel-in-progress: true

jobs:
  test:
    name: Playwright
    timeout-minutes: 30

    # https://github.com/guardian/dotcom-rendering currently only publishes an ARM64 Docker image, we have to match to run it
    runs-on: ubuntu-24.04-arm

    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5]
    steps:
      # Commercial
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: ./.github/actions/setup-node-env

      # TODO abstract this into a reusable GitHub Action e.g. https://github.com/guardian/actions-publish-image
      - name: AWS ECR configure credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.GU_ARTIFACTS_ROLE_ARN }}
          aws-region: eu-west-1
          mask-aws-account-id: 'true'

      # TODO abstract this into a reusable GitHub Action e.g. https://github.com/guardian/actions-publish-image
      - name: AWS ECR login
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          mask-password: 'true'

      # TODO abstract this into a reusable GitHub Action e.g. https://github.com/guardian/actions-publish-image
      - name: AWS ECR pull image
        id: ecr-pull
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/guardian/dotcom-rendering:branch-main"
          docker pull $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      # We always run our commercial code against the latest main of DCR
      # This does make our tests sensitive to changes in DCR
      # (e.g. imagine someone removes the top-above-nav slot from DCR)
      # This is something we accept in order to easily test our own code
      #
      # Note we use the containerised version of DCR, published from:
      # https://github.com/guardian/dotcom-rendering/blob/main/.github/workflows/container-production.yml
      #
      # The argument `--network host` is crucial here, as it means the container shares the networking stack of the host
      # This makes the commercial dev server available from inside the container
      # Note that GHA provides a service container feature, but it does not support this argument
      #
      # `GU_STAGE=CI` configures DCR to reference JS assets from the local server, rather than the CDN.
      - name: Start DCR in a container
        id: start-dcr-container
        continue-on-error: true
        env:
          IMAGE: ${{ env.IMAGE }}
        run: |
          docker run -d \
            --network host \
            -e "PORT=3030" \
            -e "GU_APP=article-rendering" \
            -e "GU_STACK=frontend" \
            -e "GU_STAGE=CI" \
            -e "DISABLE_LOGGING_AND_METRICS=true" \
            -e "COMMERCIAL_BUNDLE_URL=http://localhost:3031/graun.standalone.commercial.js" \
            $IMAGE

      # Clear AWS credentials (stored in environment variables) to avoid leaking them to any subsequent steps
      # See https://github.com/aws-actions/configure-aws-credentials/issues/1308
      # TODO abstract this into a reusable GitHub Action e.g. https://github.com/guardian/actions-publish-image
      - name: AWS ECR clear credentials
        if: always()
        shell: bash
        run: |
          echo "AWS_ACCESS_KEY_ID=''" >>"$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=''" >>"$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=''" >>"$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=''" >>"$GITHUB_ENV"
          echo "AWS_REGION=''" >>"$GITHUB_ENV"

      - name: Report if "start DCR in a container" step failed
        if: ${{ steps.start-dcr-container.outcome == 'failure' }}
        run: echo "Unable to fetch a DCR container image from the registry. Run the DCR main build in order to create a new container image." && exit 1

      - name: Turn off mandb updates
        run: |
          sudo mv /usr/bin/mandb /usr/bin/mandb-OFF
          sudo cp -p /bin/true /usr/bin/mandb

      - name: Install Playwright Browsers
        run: pnpm playwright install --with-deps chromium
        working-directory: ./bundle

      - name: Start Commercial server
        run: pnpm serve & npx wait-on -v -i 1000 http://localhost:3031/graun.standalone.commercial.js
        working-directory: ./bundle

      - name: Run Playwright
        run: pnpm playwright test --shard=${{ matrix.group }}/5
        working-directory: ./bundle

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-${{ matrix.group }}
          path: ./bundle/playwright-report
          retention-days: 5
